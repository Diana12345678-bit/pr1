<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кликер</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }
    .game {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    h1 { margin-top: 0; color: #333; }
    .instruction { color: #777; font-size: 14px; margin-bottom: 20px; }
    .score {
      font-size: 48px;
      font-weight: bold;
      color: #2b7a78;
      margin: 15px 0;
    }
    .click-btn {
      font-size: 22px;
      padding: 20px 50px;
      border: none;
      border-radius: 50%;
      background: #2b7a78;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s;
      margin: 10px 0 20px;
    }
    .click-btn:active { transform: scale(0.95); }
    .stats {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
      color: #444;
    }
    .stats div { margin: 4px 0; }
    .upgrade-btn {
      font-size: 16px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #ccc;
      color: #666;
      cursor: not-allowed;
      width: 100%;
      margin-bottom: 15px;
    }
    .upgrade-btn.active {
      background: #f0a500;
      color: #fff;
      cursor: pointer;
    }
    .achievement {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }
    .achievement.show { display: block; }
  </style>
</head>
<body>

  <div class="game">
    <h1>Кликер</h1>
    <p class="instruction">Нажимай на кнопку и копи очки. Улучшение увеличит силу клика!</p>

    <div class="score" id="score">0</div>

    <button class="click-btn" id="clickBtn">Кликнуть</button>

    <div class="stats">
      <div>Всего кликов: <span id="clicksCount">0</span></div>
      <div>Сила клика: <span id="clickPowerEl">1</span></div>
      <div>Очков в секунду: <span id="autoPowerEl">0</span></div>
    </div>

    <button class="upgrade-btn" id="upgradeBtn">Улучшение (стоимость: 10)</button>

    <div class="achievement" id="achievement">Ты в деле!</div>
  </div>

  <script>
    // --- Переменные состояния игры ---
    let score = 0;              // текущие очки
    let clicks = 0;             // всего кликов
    let clickPower = 1;         // сила одного клика
    let upgradeCost = 10;       // стоимость улучшения
    let autoPower = 0;          // очков в секунду (автоклик)
    let achievementShown = false; // показывали ли уже сообщение

    // --- Находим элементы на странице ---
    const scoreEl = document.getElementById('score');
    const clickBtn = document.getElementById('clickBtn');
    const clicksCountEl = document.getElementById('clicksCount');
    const clickPowerEl = document.getElementById('clickPowerEl');
    const autoPowerEl = document.getElementById('autoPowerEl');
    const upgradeBtn = document.getElementById('upgradeBtn');
    const achievementEl = document.getElementById('achievement');

    // --- Функция обновления интерфейса ---
    // Вызываем её после каждого изменения состояния
    function updateUI() {
      scoreEl.textContent = score;
      clicksCountEl.textContent = clicks;
      clickPowerEl.textContent = clickPower;
      autoPowerEl.textContent = autoPower;
      upgradeBtn.textContent = 'Улучшение (стоимость: ' + upgradeCost + ')';

      // Кнопка улучшения активна, только если очков хватает
      if (score >= upgradeCost) {
        upgradeBtn.disabled = false;
        upgradeBtn.classList.add('active');
      } else {
        upgradeBtn.disabled = true;
        upgradeBtn.classList.remove('active');
      }

      // Показываем сообщение при достижении 50 очков
      if (score >= 50 && !achievementShown) {
        achievementEl.classList.add('show');
        achievementShown = true;
      }
    }

    // --- Клик по большой кнопке ---
    clickBtn.addEventListener('click', () => {
      score += clickPower;
      clicks += 1;
      updateUI();
    });

    // --- Покупка улучшения ---
    upgradeBtn.addEventListener('click', () => {
      if (score < upgradeCost) return; // на всякий случай

      score -= upgradeCost;      // вычитаем стоимость
      clickPower += 1;           // сила клика растёт
      upgradeCost = upgradeCost * 2; // следующее улучшение дороже в 2 раза

      // Небольшой бонус: с каждым улучшением появляется автоклик
      autoPower += 1;

      updateUI();
    });

    // --- Автоклик: каждую секунду добавляем autoPower очков ---
    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        updateUI();
      }
    }, 1000);

    // --- Первичная отрисовка ---
    updateUI();
  </script>
</body>
</html>
